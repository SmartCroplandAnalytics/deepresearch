# 数据源声明 —— 本 plugin 的领域数据绑定（被 infra/data/providers.py 消费）。
# 安全模型：agent 不写 SQL、不见 DSN；取数经 MetricStore 安全中介（只读 + 白名单 + 参数化）。
kind: metric_postgres
dsn_env: CROPLAND_DSN                      # DSN 经环境变量注入，不进仓库
source_name: smart_cropland_analytics
views:
  raw: vw_region_time_indicator_raw        # 列：region_name, year, indicator_code, indicator_name, value, unit
  derived: vw_region_time_indicator_derived
meta_tables:
  raw: raw_indicator_meta                  # 指标白名单（code, name, unit）
  derived: derived_indicator_meta
region_table: region                       # 地区维表（name, level, parent_id）= 地区白名单
time_table: time_dimension
default_region: 四川省                      # 缺省地区；省级证据 id 不带后缀

allowed_codes:
- FARMLAND_AREA
- PADDY_FIELD_AREA
- IRRIGATED_LAND_AREA
- DRY_LAND_AREA
- SLOPE_0_2_AREA
- SLOPE_2_6_AREA
- SLOPE_6_15_AREA
- SLOPE_15_25_AREA
- SLOPE_25_PLUS_AREA
- STABLE_FARMLAND_AREA
- UNSTABLE_FARMLAND_AREA
- DEGRADED_FARMLAND_RATIO
- POLLUTED_FARMLAND_AREA
- FARMLAND_FRAGMENTATION
- INFLOW_FROM_GARDEN
- INFLOW_FROM_FOREST
- INFLOW_FROM_GRASSLAND
- INFLOW_FROM_CONSTRUCTION
- INFLOW_FROM_OTHER_AGRI
- INFLOW_FROM_UNUSED
- OUTFLOW_TO_GARDEN
- OUTFLOW_TO_FOREST
- OUTFLOW_TO_GRASSLAND
- OUTFLOW_TO_CONSTRUCTION
- OUTFLOW_TO_OTHER_AGRI
- OUTFLOW_TO_UNUSED
- PADDY_TO_IRRIGATED
- PADDY_TO_DRY
- IRRIGATED_TO_PADDY
- IRRIGATED_TO_DRY
- DRY_TO_PADDY
- DRY_TO_IRRIGATED
- FARMLAND_AREA_CHANGE
- PADDY_FIELD_CHANGE
- IRRIGATED_LAND_CHANGE
- DRY_LAND_CHANGE
- PLANTED_GRAIN_CHANGE
- PLANTED_NON_GRAIN_CHANGE
- PLANTED_GRAIN_NON_GRAIN_CHANGE
- FOREST_GRAIN_INTERCROP_CHANGE
- INTERCROP_CHANGE
- UNCULTIVATED_CHANGE
- FALLOW_CHANGE
- SLOPE_0_2_CHANGE
- SLOPE_2_6_CHANGE
- SLOPE_6_15_CHANGE
- SLOPE_15_25_CHANGE
- SLOPE_25_PLUS_CHANGE
- STABLE_FARMLAND_CHANGE
- UNSTABLE_FARMLAND_CHANGE
- DEGRADED_FARMLAND_RATIO_CHANGE
- POLLUTED_FARMLAND_CHANGE
- FARMLAND_FRAGMENTATION_CHANGE
