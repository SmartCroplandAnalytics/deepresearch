[project]
name = "agentic-studio"
version = "0.1.0"
description = "Document-production agent session layer (write/modify/fill) on a Claude-Code-like harness (deepagents on LangGraph)."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "rich>=13",
    "typer>=0.12",
]

# Heavy / infra deps are optional extras so `core` stays installable & fast.
# Layering rule (architecture review §2.5 side-line E): deepagents/langgraph/mirage/docling
# are imported ONLY under agentic_studio/infra/. core/ tools/ skills/ must not import them.
[project.optional-dependencies]
agent = [
    "deepagents>=0.6.7,<0.7",  # pin: 0.7.0 移除 backend.ls_info（Mirage 仍用），见 §11.5 支线 F
    "langgraph",
    "langchain",
    "langchain-anthropic",
    "langchain-openai",
    "langchain-tavily",
]
vfs = ["mirage-ai"]
pg = [
    "asyncpg",            # Mirage postgres resource（把 Postgres 当 VFS 挂进会话）
    "psycopg[binary]",    # MetricStore 安全中介取数层（同步只读连接）
]
doc = ["docling"]
viz = ["matplotlib>=3.8", "seaborn>=0.13"]  # 简报图表（PNG 确定性渲染、不经 LLM；seaborn 主题/配色）
embed = ["sentence-transformers>=3.0", "torch", "numpy>=1.26"]  # bge-m3 跨语言语义检索（§9）；torch 直列以便走 cu128 源
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
agentic-studio = "agentic_studio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_studio"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# typer 惯用法：Option/Argument 作为参数默认值是 typer 的正常用法，非 B008 误用。
extend-immutable-calls = ["typer.Option", "typer.Argument"]

# bge-m3 走 GPU：从 PyTorch 的 CUDA 轮子源装 torch（持久；否则 uv run 会还原成 +cpu）。
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
